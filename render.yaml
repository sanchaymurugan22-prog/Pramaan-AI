services:
  - type: web
    name: pramaan-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: AI_MODE
        value: cloud
      - key: SARVAM_BASE_URL
        value: https://api.sarvam.ai/v1
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: ALLOWED_ORIGINS
        value: "https://pramaan-ai-nine.vercel.app,http://localhost:5173,*"
